[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-test"
version = "0.1.0"
description = "Testing framework for AI agents — define tests in YAML, evaluate with AI-powered assertions, track regressions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Jaxz714" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "anthropic>=0.25.0",
]

[project.scripts]
agenttest = "agenttest.cli:main"

[project.urls]
Homepage = "https://github.com/Jaxz714/agent-test"
Repository = "https://github.com/Jaxz714/agent-test"
